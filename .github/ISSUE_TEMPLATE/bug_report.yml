name: Bug report
description: Something looks or works wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      description: A public URL where it happens, if you can share one.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Extension in Chrome
        - Extension in Edge or Brave
        - Extension in Firefox
        - Extension in Zen
        - MCP server (through the extension)
        - MCP server (headless screenshots)
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices and browsers in the simulator
      placeholder: iPhone 15 Pro in Safari, Pixel 8 in Chrome
  - type: input
    id: versions
    attributes:
      label: Versions
      description: view-sim version (settings page or manifest), your browser and OS.
      placeholder: view-sim 1.1.0, Chrome 131, macOS 15
