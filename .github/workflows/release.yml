name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension/manifest.json version $version" >&2
            exit 1
          fi
      - name: Lint the extension
        run: npx -y web-ext@8 lint --source-dir extension
      - name: Package the extension
        run: node tools/package-extension.mjs
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/view-sim-extension-${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "view-sim $GITHUB_REF_NAME" --generate-notes
          fi
