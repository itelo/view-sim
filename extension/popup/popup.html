<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../icons/logo.svg" width="28" height="28" alt="" />
      <h1><span class="light">view-</span><span class="bold">sim</span></h1>
      <button id="settings" class="icon-button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>
      </button>
    </header>
    <main class="body">
      <section id="site" class="card" hidden>
        <div class="site">
          <span class="label">This site</span>
          <span id="host" class="host"></span>
        </div>
        <label class="row">
          <span class="row-text">
            <span class="row-title">Show in the simulator</span>
            <span id="row-hint" class="row-hint">Opens every page on devices</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="toggle" role="switch" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
      </section>
      <p id="unsupported" class="card muted" hidden>The simulator runs on http and https pages only.</p>
    </main>
    <footer class="foot">
      <a id="support" class="support" href="https://github.com/sponsors/itelo" target="_blank" rel="noopener">
        <span class="heart" aria-hidden="true">♥</span> Support view-sim
      </a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
